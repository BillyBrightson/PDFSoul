name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Every push builds a Windows installer and two macOS disk images (download them from the run's
# "Artifacts"). Pushing a tag such as v0.1.0 also attaches them to a GitHub release.
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write  # to attach the installer to a release on tags
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install Ghostscript and Inno Setup
        run: choco install ghostscript innosetup --no-progress -y

      - name: Install dependencies
        run: uv sync

      - name: Lint and type-check
        run: |
          uv run ruff check src tests
          uv run mypy

      - name: Test
        run: uv run pytest -q

      - name: Build installer
        shell: pwsh
        run: packaging/build_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: PDFSoul-By-Billy-Setup
          path: dist/PDFSoul-By-Billy-Setup-*.exe

      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PDFSoul-By-Billy-Setup-*.exe

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple silicon → arm64 .dmg
          - runner: macos-15-intel  # Intel → x86_64 .dmg
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install Ghostscript and Tesseract (for the engine tests)
        run: brew install ghostscript tesseract

      - name: Install dependencies
        run: uv sync

      - name: Test
        run: uv run pytest -q

      - name: Build disk image
        run: packaging/build_mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PDFSoul-By-Billy-macOS-${{ runner.arch }}
          path: dist/PDFSoul-By-Billy-*-macOS-*.dmg

      - name: Attach disk image to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PDFSoul-By-Billy-*-macOS-*.dmg
