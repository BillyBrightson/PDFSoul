[project]
name = "pdfsoul"
version = "0.1.0"
description = "Offline desktop PDF toolkit: merge, split, compress, convert, protect, watermark. Files never leave your PC."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "PyMuPDF>=1.24.10",
    "pikepdf>=9.0",
    "Pillow>=10.4",
    "pillow-heif>=0.18",
    "typer>=0.12",
    "pdf2docx>=0.5.13",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "markdown>=3.11",
]

[project.scripts]
pdfsoul = "pdfsoul.cli.main:app"

[project.gui-scripts]
pdfsoul-gui = "pdfsoul.app.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
]
build = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfsoul"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["src/pdfsoul/core"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
